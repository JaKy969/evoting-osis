<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting OSIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-card">
        <!-- Header & Dark Mode Toggle -->
        <div class="card-header">
            <h2>E-Voting OSIS</h2>
            <button id="darkModeToggle" class="theme-toggle-btn">🌙 Dark Mode</button>
        </div>

        <!-- Progress Indicator -->
        <div class="stepper">
            <div class="step step-1 active" id="stepIndicator1">
                <span class="step-number">1</span>
                <span class="step-label">Identitas</span>
            </div>
            <div class="step-line"></div>
            <div class="step step-2" id="stepIndicator2">
                <span class="step-number">2</span>
                <span class="step-label">Pilihan Paslon</span>
            </div>
        </div>

        <!-- LANGKAH 1: INPUT IDENTITAS -->
        <div id="step1" class="step-content">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" placeholder="Contoh: XI IPA 2" autocomplete="off" required>
            </div>

            <button type="button" id="nextBtn" class="btn btn-primary">Lanjut ke Pemilihan &rarr;</button>
        </div>

        <!-- LANGKAH 2: PILIHAN PASLON -->
        <div id="step2" class="step-content" style="display: none;">
            <div class="user-greeting">
                <p>Halo, <strong id="greetingNama">...</strong> (<span id="greetingKelas">...</span>)</p>
                <small>Silakan tentukan pilihan pasangan calon pilihan Anda:</small>
            </div>

            <div class="paslon-grid">
                <!-- Paslon 1 -->
                <div class="paslon-card">
                    <div class="paslon-badge">01</div>
                    <div class="paslon-avatar">🗳️</div>
                    <h3>Paslon 1</h3>
                    <p class="paslon-slogan">"Mewujudkan OSIS yang Kreatif, Inovatif, dan Berkarakter"</p>
                    <button type="button" class="btn btn-vote voteBtn" data-paslon="Paslon 1">Pilih Paslon 1</button>
                </div>

                <!-- Paslon 2 -->
                <div class="paslon-card">
                    <div class="paslon-badge">02</div>
                    <div class="paslon-avatar">🗳️</div>
                    <h3>Paslon 2</h3>
                    <p class="paslon-slogan">"Bersama Membangun Sekolah Unggul, Disiplin, dan Berprestasi"</p>
                    <button type="button" class="btn btn-vote voteBtn" data-paslon="Paslon 2">Pilih Paslon 2</button>
                </div>
            </div>

            <button type="button" id="backBtn" class="btn btn-secondary">&larr; Kembali ke Identitas</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
