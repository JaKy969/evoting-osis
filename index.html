<form id="votingForm">
<!-- Kotak Input Nama -->
<div class="form-group">
    <label for="nama">Nama Lengkap:</label>
    <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
</div>

<!-- Kotak Input Kelas -->
<div class="form-group">
    <label for="kelas">Kelas:</label>
    <input type="text" id="kelas" placeholder="Contoh: XI-4" required>
</div>

<!-- Pilihan Paslon -->
<div class="form-group">
    <label>Pilih Paslon:</label><br>
    <label>
    <input type="radio" name="paslon" value="Paslon 1" required> Paslon 1
    </label><br>
    <label>
    <input type="radio" name="paslon" value="Paslon 2"> Paslon 2
    </label>
</div>

<!-- Tombol Kirim -->
<button type="submit" id="submitBtn">Kirim Suara</button>
</form>
