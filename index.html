<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting OSIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Tombol Dark Mode -->
        <button id="darkModeToggle" class="dark-toggle">🌙 Dark Mode</button>

        <h2>E-Voting OSIS</h2>
        
        <!-- BAGIAN 1: FORM IDENTITAS (Nama & Kelas) -->
        <div id="step1" class="step-section">
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
            </div>

            <div class="form-group">
                <label for="kelas">Kelas:</label>
                <input type="text" id="kelas" placeholder="Contoh: XI-4" required>
            </div>

            <button type="button" id="nextBtn">Lanjut Memilih</button>
        </div>

        <!-- BAGIAN 2: PILIHAN PASLON (Ada Slogan & Tombol Vote Sendiri) -->
        <div id="step2" class="step-section" style="display: none;">
            <h3>Silakan Pilih Pasangan Calon</h3>
            <p id="greetingUser" class="greeting"></p>

            <div class="paslon-card">
                <h4>Paslon 1</h4>
                <p class="slogan">"Mewujudkan OSIS yang Kreatif, Inovatif, dan Berkarakter"</p>
                <button type="button" class="voteBtn" data-paslon="Paslon 1">Vote Paslon 1</button>
            </div>

            <div class="paslon-card">
                <h4>Paslon 2</h4>
                <p class="slogan">"Bersama Membangun Sekolah Unggul, Disiplin, dan Berprestasi"</p>
                <button type="button" class="voteBtn" data-paslon="Paslon 2">Vote Paslon 2</button>
            </div>

            <button type="button" id="backBtn" class="btn-secondary">Kembali</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
